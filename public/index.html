<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b82f6">
  <title>EventMate — Управління подіями</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <h1 class="header-title">EventMate</h1>
        <p class="header-subtitle">Ваші події завжди під контролем</p>
      </div>
      <div class="header-actions">
        <button onclick="toggleTheme()" class="icon-btn" title="Тема">🌓</button>
        <button onclick="toggleLanguage()" class="icon-btn" title="Мова">🌐</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
      <div class="tabs">
        <button class="tab active" data-type="all">Всі</button>
        <button class="tab" data-type="birthday">🎂 Дні народження</button>
        <button class="tab" data-type="reminder">⏰ Нагадування</button>
        <button class="tab" data-type="event">🎊 Події</button>
      </div>
    </div>

    <!-- Events List -->
    <div id="eventsList" class="events-list"></div>

    <!-- Add Button -->
    <button id="addBtn" class="add-btn" aria-label="Додати подію">+</button>

    <!-- Modal -->
    <div id="modal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Нова подія</h2>
          <button id="closeModal" class="close-btn" aria-label="Закрити">✕</button>
        </div>

        <form id="eventForm">
          <div class="form-group">
            <label>Тип події</label>
            <div class="type-buttons">
              <button type="button" class="type-btn active" data-type="birthday">
                <span style="font-size: 24px;">🎂</span>
                <span>День народження</span>
              </button>
              <button type="button" class="type-btn" data-type="reminder">
                <span style="font-size: 24px;">⏰</span>
                <span>Нагадування</span>
              </button>
              <button type="button" class="type-btn" data-type="event">
                <span style="font-size: 24px;">🎊</span>
                <span>Подія</span>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="title">Назва події *</label>
            <input
              type="text"
              id="title"
              required
              placeholder="Наприклад: День народження Марії"
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <label for="date">Дата *</label>
            <input
              type="date"
              id="date"
              required
            >
          </div>

          <div class="form-group">
            <label for="time">Час (необов'язково)</label>
            <input
              type="time"
              id="time"
            >
          </div>

          <div class="form-group" id="birthYearGroup" style="display: block;">
            <label for="birthYear">Рік народження (необов'язково)</label>
            <input
              type="number"
              id="birthYear"
              placeholder="Наприклад: 1990"
              min="1900"
              max="2026"
            >
            <small style="color: var(--text-secondary); font-size: 12px; margin-top: 4px; display: block;">
              Для розрахунку віку в нагадуваннях
            </small>
          </div>

          <div class="form-group">
            <label for="reminderDays">Нагадати за</label>
            <select id="reminderDays">
              <option value="0">В день події</option>
              <option value="1" selected>За 1 день</option>
              <option value="2">За 2 дні</option>
              <option value="3">За 3 дні</option>
              <option value="7">За тиждень</option>
            </select>
          </div>

          <div class="form-group">
            <label for="reminderTime">Час нагадування</label>
            <input
              type="time"
              id="reminderTime"
              value="09:00"
            >
            <small style="color: var(--text-secondary); font-size: 12px; margin-top: 4px; display: block;">
              О котрій годині відправити нагадування
            </small>
          </div>

          <div class="form-group">
            <label for="notes">Нотатки (необов'язково)</label>
            <textarea
              id="notes"
              rows="3"
              placeholder="Додаткова інформація про подію..."
            ></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">
              <span>Зберегти</span>
            </button>
            <button type="button" class="btn btn-secondary" id="cancelBtn">
              <span>Скасувати</span>
            </button>
            <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;">
              <span>Видалити</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
