<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EventMate</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-type="all">Всі</button>
      <button class="tab" data-type="birthday">🎂 Дні народження</button>
      <button class="tab" data-type="reminder">⏰ Нагадування</button>
      <button class="tab" data-type="event">🎊 Події</button>
    </div>

    <!-- Events List -->
    <div id="eventsList" class="events-list"></div>

    <!-- Add Button -->
    <button id="addBtn" class="add-btn">➕ Додати подію</button>

    <!-- Modal -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Нова подія</h2>
          <button id="closeModal" class="close-btn">✕</button>
        </div>

        <form id="eventForm">
          <div class="form-group">
            <label>Тип події</label>
            <div class="type-buttons">
              <button type="button" class="type-btn" data-type="birthday">🎂 День народження</button>
              <button type="button" class="type-btn" data-type="reminder">⏰ Нагадування</button>
              <button type="button" class="type-btn" data-type="event">🎊 Подія</button>
            </div>
          </div>

          <div class="form-group">
            <label for="title">Назва *</label>
            <input type="text" id="title" required placeholder="Наприклад: День народження Марії">
          </div>

          <div class="form-group">
            <label for="date">Дата *</label>
            <input type="date" id="date" required>
          </div>

          <div class="form-group">
            <label for="time">Час (необов'язково)</label>
            <input type="time" id="time">
          </div>

          <div class="form-group">
            <label for="notes">Нотатки (необов'язково)</label>
            <textarea id="notes" rows="3" placeholder="Додаткова інформація..."></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">Зберегти</button>
            <button type="button" class="btn btn-secondary" id="cancelBtn">Скасувати</button>
            <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;">Видалити</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
